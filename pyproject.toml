[project]
name = "harvard-events"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "romal", email = "romaluo000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28.1",
    "icalendar>=7.3.0",
    "lxml>=6.1.2",
    "python-dateutil>=2.9.0.post0",
    "pyyaml>=6.0.3",
    "tzdata>=2026.3",
]

[project.scripts]
harvard-events = "harvard_events:main"

[build-system]
requires = ["uv_build>=0.9.2,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
